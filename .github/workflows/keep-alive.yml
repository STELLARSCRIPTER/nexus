name: Supabase Keep Alive

on:
  schedule:
    # Runs at 00:00 every 3 days
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Lets you test it manually

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database via REST API
        run: |
          # Notice the "gold.fct_revenue_intelligence" and "limit=0"
          curl -i -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/fct_revenue_intelligence?select=*&limit=0" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Accept-Profile: gold"
